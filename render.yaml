# Render Blueprint for RemiDex on a server. For now it runs the server check (hosted/check.py, built by the Dockerfile);
# the same service becomes the RemiDex website (remidex.xyz) once the check shows RemiliaNET works from Render.
# Render asks for CHECK_PASSWORD when you create it: the check page asks for that password before anything else.
services:
  - type: web
    name: remidex
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: CHECK_PASSWORD
        sync: false
